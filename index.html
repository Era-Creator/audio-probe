<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Assist</title>
<style>
  :root { color-scheme: light dark; --fg:#1c1c1e; --mut:#8a8a8e; --line:#8884; --ok:#1a8f4a; --bad:#d13; --accent:#2a7; }
  * { box-sizing: border-box; }
  body { font: 16px/1.5 system-ui, -apple-system, sans-serif; max-width: 440px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--mut); font-size: 13px; margin: 0 0 20px; }
  label { display:block; font-size:13px; color:var(--mut); margin: 10px 0 3px; }
  input { font: inherit; width:100%; padding:11px; border-radius:10px; border:1px solid var(--line); background:transparent; color:inherit; }
  button { font: inherit; border:none; border-radius:12px; cursor:pointer; }
  .primary { width:100%; padding:13px; background:var(--accent); color:#fff; font-weight:600; font-size:16px; }
  .ghost { background:transparent; color:var(--mut); border:1px solid var(--line); padding:9px 14px; }
  .hidden { display:none !important; }
  .check { display:flex; align-items:center; gap:8px; color:var(--mut); font-size:13px; margin-top:12px; }
  .check input { width:auto; }
  .status { font-size:13px; margin-top:12px; min-height:1.2em; }
  .status.ok { color:var(--ok); } .status.bad { color:var(--bad); }

  /* main */
  .reccol { text-align:center; padding:8px 0; }
  .recbtn { width:168px; height:168px; border-radius:50%; margin:14px auto; background:var(--accent); color:#fff;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:17px; font-weight:600;
            transition:background .15s, transform .1s; }
  .recbtn:active { transform:scale(.97); }
  .recbtn.on { background:var(--bad); animation:pulse 1.6s infinite; }
  .recbtn .ic { font-size:38px; line-height:1; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(209,51,34,.45)} 50%{box-shadow:0 0 0 16px rgba(209,51,34,0)} }
  .timer { font-size:30px; font-variant-numeric:tabular-nums; font-weight:600; margin:4px 0; }
  .meta { color:var(--mut); font-size:13px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--mut); margin-right:5px; vertical-align:middle; }
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
  .bars { display:flex; gap:12px; margin:14px 0 4px; }
  .bars > div { flex:1; }
  .bars .cap { font-size:11px; color:var(--mut); margin-bottom:4px; }
  .meter { height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
  .meter > i { display:block; height:100%; width:0%; background:var(--accent); transition:width .07s linear; }
  .toprow { display:flex; justify-content:space-between; align-items:center; }
  .gear { background:transparent; color:var(--mut); font-size:20px; padding:4px 8px; }
  details { margin-top:16px; } summary { color:var(--mut); font-size:13px; cursor:pointer; }
  #log { white-space:pre-wrap; font:12px/1.4 ui-monospace,monospace; color:var(--mut); max-height:140px; overflow:auto; margin-top:8px; }
  .hint { color:var(--mut); font-size:12.5px; margin-top:10px; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<section id="lock">
  <h1>Audio Assist</h1>
  <p class="sub">Введите пароль.</p>
  <label>Пароль</label>
  <input id="lk-token" type="password" placeholder="пароль" autocomplete="off" autocapitalize="off">
  <div class="check"><input type="checkbox" id="lk-remember"><label for="lk-remember" style="margin:0;color:inherit">Запомнить на этом устройстве (быстрый вход)</label></div>
  <p class="status" id="lk-status"></p>
  <button class="primary" id="lk-go">Войти</button>
</section>

<!-- ЭКРАН ЗАПИСИ -->
<section id="main" class="hidden">
  <div class="toprow">
    <div><span class="dot" id="conn"></span><span class="meta" id="connt">готов</span></div>
    <button class="gear" id="gear" title="Настройки">⚙</button>
  </div>

  <div class="reccol">
    <button class="recbtn" id="rec"><span class="ic" id="recic">●</span><span id="reclbl">Запись</span></button>
    <div class="timer hidden" id="timer">00:00</div>
    <div class="meta hidden" id="delivered"></div>
  </div>

  <div class="bars hidden" id="bars">
    <div><div class="cap">Ваш голос</div><div class="meter"><i id="micBar"></i></div></div>
    <div><div class="cap">Собеседник</div><div class="meter"><i id="sysBar"></i></div></div>
  </div>

  <p class="hint" id="hint"></p>

  <!-- Настройки -->
  <section id="settings" class="hidden">
    <label>Адрес приёма</label>
    <input id="st-url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label>Название встречи (необязательно)</label>
    <input id="st-title" placeholder="напр. созвон с поставщиком" autocomplete="off">
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="ghost" id="st-save">Сохранить</button>
      <button class="ghost" id="st-forget">Забыть ключ / выйти</button>
    </div>
  </section>

  <details>
    <summary>Журнал</summary>
    <div id="log"></div>
  </details>
</section>

<script>
const $ = id => document.getElementById(id);
const LS = { url:"aa_url", token:"aa_token", title:"aa_title" };
const DEFAULT_URL = "https://kindle-clay-prevalent.ngrok-free.dev";  // вшитый адрес приёма; меняется под ⚙
const SR = 16000, CHUNK_MS = 3000, MAX_RETRY = 3;

let token = "", recording = false, session = null, pumps = [], t0 = 0, timerIv = null, lastSeq = 0;
const base = () => ((localStorage.getItem(LS.url) || DEFAULT_URL).trim().replace(/\/+$/, ""));
const log = m => { const l=$("log"); if(!l) return; l.textContent += m + "\n"; l.scrollTop = l.scrollHeight; };

/* ---------- вход ---------- */
async function tryUnlock(tok, remember) {
  const r = await fetch(`${base()}/auth?token=${encodeURIComponent(tok)}`, { method:"GET", headers:{ "ngrok-skip-browser-warning":"1" } });
  if (r.status === 200) {
    token = tok;
    if (remember) localStorage.setItem(LS.token, tok); else localStorage.removeItem(LS.token);
    openMain();
    return true;
  }
  if (r.status === 401) throw new Error("Неверный пароль");
  throw new Error("Приёмник ответил " + r.status);
}
$("lk-go").onclick = async () => {
  const s = $("lk-status"); s.className="status"; s.textContent="Проверяю…";
  const tok = $("lk-token").value.trim();
  if (!tok) { s.className="status bad"; s.textContent="Введите пароль."; return; }
  try { await tryUnlock(tok, $("lk-remember").checked); }
  catch (e) { s.className="status bad"; s.textContent = /Failed|fetch|network/i.test(e.message) ? "Приёмник недоступен." : e.message; }
};
$("lk-token").addEventListener("keydown", e => { if (e.key==="Enter") $("lk-go").click(); });

// быстрый вход, если пароль запомнен
(async () => {
  const tok = localStorage.getItem(LS.token);
  if (tok) { try { await tryUnlock(tok, true); } catch {} }
})();

/* ---------- экран записи ---------- */
function openMain() {
  $("lock").classList.add("hidden"); $("main").classList.remove("hidden");
  $("st-url").value = localStorage.getItem(LS.url) || DEFAULT_URL;
  $("st-title").value = localStorage.getItem(LS.title) || "";
  setConn(null, "готов");
  $("hint").textContent = "Нажмите «Запись» и выберите вкладку созвона (звук включится сам) либо весь экран с галочкой «Также передавать системный звук».";
}
function setConn(state, text) {
  $("conn").className = "dot" + (state===true?" ok":state===false?" bad":"");
  $("connt").textContent = text;
}
$("gear").onclick = () => $("settings").classList.toggle("hidden");
$("st-save").onclick = () => {
  localStorage.setItem(LS.url, $("st-url").value.trim());
  localStorage.setItem(LS.title, $("st-title").value.trim());
  $("settings").classList.add("hidden"); setConn(null, "сохранено");
};
$("st-forget").onclick = () => { localStorage.removeItem(LS.token); location.reload(); };

/* уровни */
function meter(track, bar) {
  const ctx = new AudioContext(); const an = ctx.createAnalyser(); an.fftSize = 512;
  ctx.createMediaStreamSource(new MediaStream([track])).connect(an);
  const buf = new Uint8Array(an.fftSize);
  (function tick(){ an.getByteTimeDomainData(buf); let p=0; for(const v of buf)p=Math.max(p,Math.abs(v-128));
    bar.style.width = Math.min(100, Math.round(p/128*140))+"%";
    if (track.readyState==="live" && recording) requestAnimationFrame(tick); else bar.style.width="0%"; })();
}

/* PCM-насос: дорожка → 16 кГц Int16 → чанки ~CHUNK_MS */
function startPump(stream, label) {
  const ctx = new AudioContext({ sampleRate: SR });
  const src = ctx.createMediaStreamSource(stream);
  const node = ctx.createScriptProcessor(4096, 1, 1);
  const sink = ctx.createGain(); sink.gain.value = 0;
  src.connect(node); node.connect(sink); sink.connect(ctx.destination);
  let acc = [], accLen = 0, seq = 0; const need = Math.round(SR*CHUNK_MS/1000);
  node.onaudioprocess = e => {
    if (!recording) return;
    const f = e.inputBuffer.getChannelData(0); const i16 = new Int16Array(f.length);
    for (let i=0;i<f.length;i++){ let s=Math.max(-1,Math.min(1,f[i])); i16[i]= s<0? s*32768 : s*32767; }
    acc.push(i16); accLen += i16.length;
    while (accLen >= need) {
      const out = new Int16Array(need); let o=0;
      while (o<need){ const h=acc[0]; const take=Math.min(h.length,need-o); out.set(h.subarray(0,take),o); o+=take; if(take===h.length)acc.shift(); else acc[0]=h.subarray(take); }
      accLen -= need; send(label, seq++, out.buffer);
    }
  };
  return { ctx };
}

let q = Promise.resolve();
function send(track, seq, buf) {
  q = q.then(async () => {
    for (let attempt=1; attempt<=MAX_RETRY; attempt++) {
      try {
        const r = await fetch(`${base()}/chunk?session=${session}&track=${track}&seq=${seq}&token=${encodeURIComponent(token)}`,
                              { method:"POST", headers:{ "Content-Type":"text/plain" }, body: buf });
        if (r.ok) { if (track==="mic"){ lastSeq=Math.max(lastSeq,seq); updateDelivered(); } setConn(true,"идёт передача"); return; }
        throw new Error("HTTP "+r.status);
      } catch (e) {
        if (attempt===MAX_RETRY) { setConn(false,"сбой связи — повтор не удался"); log(`✗ ${track}#${seq}: ${e.message}`); }
        else await new Promise(r=>setTimeout(r, 400*attempt));
      }
    }
  });
}
function updateDelivered(){ $("delivered").textContent = "доставлено " + ((lastSeq+1)*CHUNK_MS/1000|0) + " c"; }
function fmt(s){ const m=(s/60|0).toString().padStart(2,"0"), x=(s%60).toString().padStart(2,"0"); return m+":"+x; }

/* старт / стоп */
$("rec").onclick = () => recording ? stop() : start();
document.addEventListener("keydown", e => { if (e.code==="Space" && !$("main").classList.contains("hidden") && e.target.tagName!=="INPUT"){ e.preventDefault(); $("rec").click(); }});

async function start() {
  if (!base()) { setConn(false,"нет адреса — откройте ⚙"); return; }
  if (!navigator.mediaDevices?.getDisplayMedia) { setConn(false,"нужен Chrome / https"); return; }
  let mic, disp;
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
    setConn(null,"выберите экран со звуком…");
    disp = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:1 }, audio:true, systemAudio:"include", selfBrowserSurface:"exclude", surfaceSwitching:"exclude" });
  } catch (e) { mic?.getTracks().forEach(t=>t.stop()); setConn(false, e.name==="NotAllowedError"?"доступ не выдан":e.message); return; }
  disp.getVideoTracks().forEach(t=>t.stop());
  const sys = disp.getAudioTracks();
  if (!sys.length) { mic.getTracks().forEach(t=>t.stop()); setConn(false,"нет системного звука — нужна галочка/вкладка со звуком"); $("hint").textContent="Системный звук не передан. Нажмите «Запись» снова и выберите вкладку созвона ИЛИ весь экран с галочкой «Также передавать системный звук»."; return; }

  session = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  recording = true; lastSeq = -1; q = Promise.resolve();
  pumps = [startPump(mic, "mic"), startPump(new MediaStream([sys[0]]), "sys")];
  meter(mic.getAudioTracks()[0], $("micBar")); meter(sys[0], $("sysBar"));
  sys[0].onended = () => { if (recording) stop(); };
  pumps._tracks = [mic.getAudioTracks()[0], sys[0]];

  $("rec").classList.add("on"); $("recic").textContent="■"; $("reclbl").textContent="Стоп";
  $("timer").classList.remove("hidden"); $("delivered").classList.remove("hidden"); $("bars").classList.remove("hidden");
  $("hint").textContent=""; setConn(true,"идёт запись");
  t0 = Date.now(); $("timer").textContent="00:00";
  timerIv = setInterval(()=> $("timer").textContent = fmt((Date.now()-t0)/1000|0), 500);
  log("сессия "+session+" — старт");
}

async function stop() {
  recording = false; clearInterval(timerIv);
  $("rec").classList.remove("on"); $("recic").textContent="●"; $("reclbl").textContent="Запись";
  (pumps._tracks||[]).forEach(t=>{try{t.stop()}catch{}}); pumps.forEach(p=>{try{p.ctx.close()}catch{}});
  setConn(null,"отправляю хвост…");
  await q;
  const meta = { startedUtc:new Date(t0).toISOString(), utcOffsetMin:-new Date().getTimezoneOffset(), title:(localStorage.getItem(LS.title)||"").trim() };
  try {
    await fetch(`${base()}/finish?session=${session}&token=${encodeURIComponent(token)}`, { method:"POST", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify(meta) });
    setConn(true,"готово — встреча уйдёт в библиотеку"); log("сессия завершена и отправлена");
  } catch (e) { setConn(false,"финал не доставлен: "+e.message); }
  $("timer").classList.add("hidden"); $("delivered").classList.add("hidden"); $("bars").classList.add("hidden");
}
</script>
</body>
</html>
